# Weekly dependency vulnerability/update checks. Security fixes are also raised
# immediately via Dependabot security updates (enabled in repo settings).
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
